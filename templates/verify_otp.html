<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Email Verification · SMS-PRA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">🔒</div>
        <div>
          <h1>Email Verification</h1>
          <div class="muted">Enter the 6-digit code sent to your Deerwalk email</div>
        </div>
      </div>

      {% if message %}
      <div class="alert">{{ message }}</div>
      {% endif %}

      <!-- OTP Input Form -->
      <form method="post" class="form">
        <div class="field">
          <span>Verification Code</span>
          <input type="text" name="otp" placeholder="Enter 6-digit code" required />
        </div>
        <button type="submit" class="btn-primary">Verify</button>
      </form>

      <!-- 🔁 Add this below -->
      <form method="post" action="{{ url_for('resend_otp', email=email) }}" style="margin-top:12px;">
        <button class="ghost" type="submit">Resend code</button>
      </form>

      <div class="center small muted" style="margin-top:16px">
        <p>Didn’t get the code? Check your spam folder or contact admin.</p>
      </div>
    </div>
  </div>
</body>
</html>
