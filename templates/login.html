<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login · SMS-PRA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">🎓</div>
        <div>
          <h1>School Management System (SMS-PRA)</h1>
          <div class="muted">Welcome back! Please sign in to continue.</div>
        </div>
      </div>

      {% if message %}
      <div class="alert">{{ message }}</div>
      {% endif %}

      <form method="post" class="form">
        <div class="field">
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="field password-row">
          <div style="flex:1">
            <span>Password</span>
            <input type="password" name="password" placeholder="••••••" required />
          </div>
        </div>

        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <div class="divider"><span>or</span></div>
      <div class="role-row">
        <a href="#" class="chip">Student</a>
        <a href="#" class="chip">Faculty</a>
        <a href="#" class="chip">Admin</a>
      </div>
    </div>
  </div>
</body>
</html>
